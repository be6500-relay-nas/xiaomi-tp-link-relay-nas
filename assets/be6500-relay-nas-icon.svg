<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb56b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- WiFi 上联波纹（校园网无线） -->
  <g fill="none" stroke="url(#wifi)" stroke-width="12" stroke-linecap="round">
    <path d="M 124.5 114.5 A 36 36 0 0 1 175.5 114.5"/>
    <path d="M 104.7 94.7 A 64 64 0 0 1 195.3 94.7"/>
    <path d="M 85 75 A 92 92 0 0 1 215 75"/>
  </g>

  <!-- 节点 1：小米路由（SSH &gt;_） -->
  <line x1="120" y1="150" x2="120" y2="136" stroke="#9db4d8" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="150" x2="180" y2="136" stroke="#9db4d8" stroke-width="8" stroke-linecap="round"/>
  <rect x="64" y="150" width="196" height="92" rx="20" fill="#182848" stroke="#7ea6ff" stroke-width="3"/>
  <circle cx="92" cy="176" r="6" fill="#37d67a"/>
  <circle cx="114" cy="176" r="6" fill="#37d67a"/>
  <circle cx="136" cy="176" r="6" fill="#2b3f66"/>
  <text x="100" y="222" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="bold" fill="#8ef0c0">&gt;_</text>

  <!-- 有线回程链路 -->
  <line x1="260" y1="196" x2="308" y2="264" stroke="#3d5a8a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="260" cy="196" r="7" fill="#4da3ff"/>
  <circle cx="308" cy="264" r="7" fill="#4da3ff"/>

  <!-- 节点 2：TP-Link 交换/子路由 -->
  <rect x="296" y="240" width="148" height="68" rx="16" fill="#122036" stroke="#4da3ff" stroke-width="3"/>
  <g fill="#0e1830" stroke="#4da3ff" stroke-width="1.5">
    <rect x="316" y="282" width="16" height="14" rx="3"/>
    <rect x="340" y="282" width="16" height="14" rx="3"/>
    <rect x="364" y="282" width="16" height="14" rx="3"/>
    <rect x="388" y="282" width="16" height="14" rx="3"/>
  </g>

  <line x1="374" y1="308" x2="374" y2="332" stroke="#3d5a8a" stroke-width="9" stroke-linecap="round"/>

  <!-- 节点 3：NAS 硬盘 -->
  <rect x="296" y="332" width="176" height="104" rx="18" fill="#101c33" stroke="#4a5f8a" stroke-width="3"/>
  <rect x="314" y="352" width="128" height="18" rx="6" fill="#1d2f52"/>
  <rect x="314" y="382" width="128" height="18" rx="6" fill="#1d2f52"/>
  <circle cx="456" cy="361" r="6" fill="#37d67a"/>
  <circle cx="456" cy="391" r="6" fill="#ffb648"/>

  <!-- SSH root 终端徽章 -->
  <rect x="64" y="356" width="132" height="60" rx="14" fill="#0b1a13" stroke="#2e7d5b" stroke-width="2.5"/>
  <text x="130" y="400" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="32" font-weight="bold" fill="#52e39b">&gt;_</text>
</svg>
