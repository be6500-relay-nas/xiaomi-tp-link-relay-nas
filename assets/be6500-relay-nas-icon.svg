<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb56b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- WiFi 上联波纹 -->
  <g fill="none" stroke="url(#wifi)" stroke-width="14" stroke-linecap="round">
    <path d="M 227.7 169.7 A 40 40 0 0 1 284.3 169.7"/>
    <path d="M 203.7 145.7 A 74 74 0 0 1 308.3 145.7"/>
    <path d="M 179.6 121.6 A 108 108 0 0 1 332.4 121.6"/>
  </g>

  <!-- 双天线 -->
  <line x1="160" y1="330" x2="160" y2="204" stroke="#9db4d8" stroke-width="13" stroke-linecap="round"/>
  <circle cx="160" cy="196" r="7.5" fill="#9db4d8"/>
  <line x1="352" y1="330" x2="352" y2="204" stroke="#9db4d8" stroke-width="13" stroke-linecap="round"/>
  <circle cx="352" cy="196" r="7.5" fill="#9db4d8"/>

  <!-- 机身 -->
  <rect x="86" y="330" width="340" height="112" rx="28" fill="#182848" stroke="#7ea6ff" stroke-width="4"/>

  <!-- LED 指示灯（左） -->
  <circle cx="128" cy="372" r="10" fill="#37d67a"/>
  <circle cx="162" cy="372" r="10" fill="#37d67a"/>
  <circle cx="196" cy="372" r="10" fill="#ffb648"/>
  <circle cx="230" cy="372" r="10" fill="#2b3f66"/>

  <!-- 网口格栅（右） -->
  <g fill="#0e1830" stroke="#4da3ff" stroke-width="2">
    <rect x="304" y="392" width="38" height="15" rx="5"/>
    <rect x="352" y="392" width="38" height="15" rx="5"/>
    <rect x="400" y="392" width="38" height="15" rx="5"/>
  </g>
</svg>
