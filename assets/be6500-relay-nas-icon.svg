<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb56b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- WiFi 符号（整体上移，与路由器拉开距离） -->
  <circle cx="256" cy="192" r="11" fill="url(#wifi)"/>
  <g fill="none" stroke="url(#wifi)" stroke-width="13" stroke-linecap="round">
    <path d="M 223.5 159.5 A 46 46 0 0 1 288.5 159.5"/>
    <path d="M 199.4 135.4 A 80 80 0 0 1 312.6 135.4"/>
    <path d="M 175.4 111.4 A 114 114 0 0 1 336.6 111.4"/>
  </g>

  <!-- 双天线（加长） -->
  <line x1="152" y1="316" x2="152" y2="174" stroke="#9db4d8" stroke-width="15" stroke-linecap="round"/>
  <circle cx="152" cy="166" r="8.5" fill="#9db4d8"/>
  <line x1="360" y1="316" x2="360" y2="174" stroke="#9db4d8" stroke-width="15" stroke-linecap="round"/>
  <circle cx="360" cy="166" r="8.5" fill="#9db4d8"/>

  <!-- 机身（下移） -->
  <rect x="76" y="316" width="360" height="124" rx="30" fill="#182848" stroke="#7ea6ff" stroke-width="4"/>

  <!-- LED（左） -->
  <circle cx="130" cy="378" r="11" fill="#37d67a"/>
  <circle cx="166" cy="378" r="11" fill="#37d67a"/>
  <circle cx="202" cy="378" r="11" fill="#ffb648"/>
  <circle cx="238" cy="378" r="11" fill="#2b3f66"/>

  <!-- 网口（右） -->
  <g fill="#0e1830" stroke="#4da3ff" stroke-width="2">
    <rect x="296" y="370" width="40" height="16" rx="6"/>
    <rect x="344" y="370" width="40" height="16" rx="6"/>
    <rect x="392" y="370" width="36" height="16" rx="6"/>
  </g>
</svg>
